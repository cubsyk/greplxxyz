<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>Kontak | Goreplix</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
:root{--ink:#161a22;--paper:#f4f5f7;--card:#fff;--line:#d9dce2;--muted:#5b6270;--red:#c8102e;--red-d:#9d0c24;--serif:Charter,'Iowan Old Style','Palatino Linotype',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#eceef2;--paper:#111318;--card:#1a1d24;--line:#2c313b;--muted:#9aa2b1;--red:#ff4d63;--red-d:#ff7a8a}}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{margin:0;min-height:100%;display:flex;flex-direction:column;font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden}a{color:var(--red)}a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{position:sticky;top:0;z-index:1000;background:#111318;border-bottom:3px solid var(--red)}.bar-wrap{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:130px;height:auto;display:block}nav{display:flex;gap:6px}nav a{color:#f4f5f7;text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:6px;transition:background .2s}nav a:hover,nav a:focus-visible{background:var(--red);color:#fff}.hamburger{display:none;flex-direction:column;cursor:pointer;padding:8px}.bar{height:3px;width:25px;background:var(--red);margin:3px 0;transition:.3s}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:32px 20px}.page-heading{font-family:var(--serif);font-size:clamp(32px,5vw,48px);line-height:1.15;margin:0 0 8px}.page-intro{color:var(--muted);font-family:var(--serif);font-size:18px;margin:0 0 26px}.doc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:4px;padding:clamp(20px,4vw,40px);max-width:820px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.05)}.doc h2{font-family:var(--serif);font-size:32px;line-height:1.2;margin:0 0 20px}.doc h3{font-family:var(--serif);font-size:22px;margin:24px 0 8px}.doc p,.doc li{font-family:var(--serif);font-size:17px;line-height:1.75}.doc p{margin:10px 0}.doc ul{padding-left:24px}.doc li{margin-bottom:12px}.doc a{text-decoration:none}.doc a:hover{text-decoration:underline}.social-links{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 20px}.social-links img{width:40px;height:40px;object-fit:contain;transition:transform .2s}.social-links img:hover{transform:scale(1.1)}footer{background:var(--card);border-top:3px solid var(--red);text-align:center;padding:20px;font-size:14px;color:var(--muted)}footer a{color:var(--red);text-decoration:none;font-weight:600}footer a:hover{text-decoration:underline}
@media(max-width:768px){main{padding:24px 16px}nav{display:none;flex-direction:column;position:absolute;top:100%;right:12px;background:#111318;border:1px solid #353943;border-radius:6px;width:210px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}nav.active{display:flex}nav a{color:#f4f5f7;padding:11px 12px}.hamburger{display:flex}.hamburger.active .bar:nth-child(1){transform:rotate(-45deg) translate(-5px,6px)}.hamburger.active .bar:nth-child(2){opacity:0}.hamburger.active .bar:nth-child(3){transform:rotate(45deg) translate(-5px,-6px)}.doc{padding:22px 18px}.doc h2{font-size:28px}.doc p,.doc li{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
    <header><div class="bar-wrap"><a href="https://goreplix.online" aria-label="Goreplix Beranda"><img src="images/logo.gif" alt="Goreplix" class="logo"></a><div class="hamburger" id="hamburger" onclick="toggleNav(this)" aria-label="Buka menu" aria-controls="nav" aria-expanded="false"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><nav id="nav"><a href="https://goreplix.online">Beranda</a><a href="./darkness">Darkness</a><a href="./incident">Incident</a><a href="./contact">Kontak</a></nav></div></header>

    <main>
        <section class="doc contact-section">
            <h2>Kontak Kami</h2>
            <p>Silakan hubungi kami melalui email atau media sosial berikut.</p>            
            <h3>Email:</h3>
            <p>goreplix@gmail.com</p>
            
            <h3>Media Sosial:</h3>
            <div class="social-links">
                <a href="#" target="_blank">
                    <img src="images/contact1.png" alt="Twitter Logo">
                </a>
                <a href="#" target="_blank">
                    <img src="images/contact2.png" alt="Facebook Logo">
                </a>
                <a href="https://instagram.com/goreplix" target="_blank">
                    <img src="images/contact3.png" alt="Instagram Logo">
                </a>
                <a href="https://www.tiktok.com/@goreplix" target="_blank">
                    <img src="images/contact4.png" alt="Tiktok Logo">
                </a>
            </div>
            
            <p>Jika Anda memiliki pertanyaan lain, kami siap membantu Anda!</p>
        </section>
    </main>
    <footer>
        <div>
            &copy; 2024 Goreplix. Semua hak dilindungi. | <a href="./tou" style="color: red;">Terms of Use</a>
        </div>
    </footer>

    

<script>function toggleNav(element){const nav=document.getElementById('nav');const isOpen=nav.classList.toggle('active');element.classList.toggle('active');element.setAttribute('aria-expanded',String(isOpen));}document.addEventListener('click',function(event){const nav=document.getElementById('nav');const hamburger=document.getElementById('hamburger');if(nav&&!nav.contains(event.target)&&hamburger&&!hamburger.contains(event.target)){nav.classList.remove('active');hamburger.classList.remove('active');hamburger.setAttribute('aria-expanded','false');}});</script>
</body>
</html>
