<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goreplix</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f0f0f;
      color:white;
      overflow:hidden;
      position:relative;
    }

    .bg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at top left, rgba(255,0,0,0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 30%);
      filter:blur(10px);
    }

    .container{
      position:relative;
      text-align:center;
      padding:40px;
      max-width:600px;
      z-index:1;
    }

    h1{
      font-size:64px;
      letter-spacing:2px;
      margin-bottom:20px;
      color:#ffffff;
    }

    p{
      font-size:20px;
      color:#cfcfcf;
      line-height:1.6;
    }

    .line{
      width:120px;
      height:4px;
      background:#ff2b2b;
      margin:25px auto;
      border-radius:10px;
    }

    .footer{
      margin-top:35px;
      font-size:14px;
      color:#777;
    }

    @media(max-width:600px){
      h1{
        font-size:42px;
      }

      p{
        font-size:17px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="container">
    <h1>Goreplix</h1>

    <div class="line"></div>

    <p>
      Website ini sudah tidak beroperasi.
      <br>
      Terima kasih telah mengunjungi Goreplix.
    </p>

    <div class="footer">
      © 2026 Goreplix
    </div>
  </div>

</body>
</html>
